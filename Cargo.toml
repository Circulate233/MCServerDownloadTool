[package]
name = "mc-server-download-tool"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Validated manifest runner for Minecraft server installation"

[lib]
name = "mc_server_download_tool"
path = "src/lib.rs"

[[bin]]
name = "mc-server-download-tool"
path = "src/main.rs"

[dependencies]
atomic-write-file = "0.3"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
httpdate = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "json", "rustls-tls", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
sys-locale = "0.3"
thiserror = "2.0"
url = "2.5"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
