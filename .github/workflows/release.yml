name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      package-name: ${{ steps.release.outputs.package-name }}
      binary-name: ${{ steps.release.outputs.binary-name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate release tag
        id: release
        shell: pwsh
        run: ./.github/scripts/Verify-ReleaseTag.ps1

  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test release workflow scripts
        shell: pwsh
        run: ./.github/scripts/Test-ReleaseScripts.ps1

      - name: Lint GitHub Actions workflows
        shell: pwsh
        run: ./.github/scripts/Invoke-Actionlint.ps1

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build:
    name: Build (${{ matrix.platform }})
    needs:
      - validate
      - quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-musl
          - os: macos-15
            platform: macos-aarch64
            target: aarch64-apple-darwin
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Rust target
        shell: pwsh
        run: rustup target add "${{ matrix.target }}"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Verify native runner architecture
        shell: pwsh
        run: ./.github/scripts/Test-RunnerArchitecture.ps1 -Target "${{ matrix.target }}"

      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build release binary
        shell: pwsh
        run: >-
          $env:MCSDT_RELEASE_VERSION = "${{ needs.validate.outputs.version }}";
          cargo build --release --locked --target "${{ matrix.target }}"

      - name: Smoke test release binary
        shell: pwsh
        run: >-
          ./.github/scripts/Test-BuiltBinary.ps1
          -Target "${{ matrix.target }}"
          -Platform "${{ matrix.platform }}"
          -ExpectedVersion "${{ needs.validate.outputs.version }}"

      - name: Stage raw release asset
        id: stage
        shell: pwsh
        run: >-
          ./.github/scripts/Stage-ReleaseBinary.ps1
          -Target "${{ matrix.target }}"
          -Platform "${{ matrix.platform }}"
          -ExpectedVersion "${{ needs.validate.outputs.version }}"

      - name: Upload staged release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.stage.outputs.artifact-name }}
          path: ${{ steps.stage.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download staged assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: downloaded-assets
          merge-multiple: true

      - name: Generate checksums and release index
        shell: pwsh
        run: >-
          ./.github/scripts/New-ReleaseMetadata.ps1
          -AssetDirectory ./downloaded-assets
          -OutputDirectory ./dist
          -Repository "${{ github.repository }}"
          -Tag "${{ github.ref_name }}"
          -CommitSha "${{ github.sha }}"
          -RunId "${{ github.run_id }}"
          -RunAttempt "${{ github.run_attempt }}"
          -ServerUrl "${{ github.server_url }}"

      - name: Attest release asset provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./dist/MCServerDownloadTool-*

      - name: Export provenance bundle
        shell: pwsh
        run: Copy-Item -LiteralPath "${{ steps.attest.outputs.bundle-path }}" -Destination ./dist/provenance.sigstore.json

      - name: Create formal release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=(--verify-tag --generate-notes --title "${GITHUB_REF_NAME}")
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* "${release_flags[@]}"
