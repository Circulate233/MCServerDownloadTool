name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, test, and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test release workflow scripts
        shell: pwsh
        run: ./.github/scripts/Test-ReleaseScripts.ps1

      - name: Lint GitHub Actions workflows
        shell: pwsh
        run: ./.github/scripts/Invoke-Actionlint.ps1

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  release-build:
    name: Release build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-musl
          - os: macos-15
            platform: macos-aarch64
            target: aarch64-apple-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        shell: pwsh
        run: rustup target add "${{ matrix.target }}"

      - name: Verify native runner architecture
        shell: pwsh
        run: ./.github/scripts/Test-RunnerArchitecture.ps1 -Target "${{ matrix.target }}"

      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build release binary
        shell: pwsh
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Smoke test release binary
        shell: pwsh
        run: >-
          ./.github/scripts/Test-BuiltBinary.ps1
          -Target "${{ matrix.target }}"
          -Platform "${{ matrix.platform }}"

      - name: Stage binary
        id: stage
        shell: pwsh
        run: >-
          ./.github/scripts/Stage-CiBinary.ps1
          -Target "${{ matrix.target }}"
          -Platform "${{ matrix.platform }}"

      - name: Upload short-lived binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.stage.outputs.artifact-name }}
          path: ${{ steps.stage.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
